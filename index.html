<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>郑靖文 - 三维作品集</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif;}
        body{background:#f4f6f8;color:#222;padding:30px;max-width:1200px;margin:0 auto;}
        h1{text-align:center;margin-bottom:40px;font-size:32px;}
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:24px;}
        .card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 12px #00000015;}
        .card img{width:100%;height:300px;object-fit:cover;display:block;}
        .info{padding:16px;}
        .info h3{margin-bottom:8px;}
        .info p{color:#555;line-height:1.6;}
    </style>
</head>
<body>
    <h1>郑靖文｜三维作品集</h1>
    <div class="grid">
        <div class="card">
            <img src="ytr.jpg" alt="Blender国风古街场景">
            <div class="info">
                <h3>Blender 国风古街场景建模</h3>
                <p>国风古风街道场景，包含建筑、植被、远景山体，Blender渲染</p>
            </div>
        </div>
        <div class="card">
            <img src="ygtfrd.jpg" alt="Blender卡通庭院场景">
            <div class="info">
                <h3>Blender 卡通庭院场景</h3>
                <p>Q版卡通风格庭院场景，卡通化道具、氛围搭建</p>
            </div>
        </div>
        <div class="card">
            <img src="ghfdr.jpg" alt="3ds Max室内场景">
            <div class="info">
                <h3>3ds Max 室内场景搭建</h3>
                <p>室内空间模型搭建、灯光渲染，空间布局设计</p>
            </div>
        </div>
        <div class="card">
            <img src="y.jpg" alt="Unity Playmaker 2D游戏">
            <div class="info">
                <h3>Unity Playmaker 2D小游戏</h3>
                <p>无代码Playmaker逻辑开发，2D平台闯关游戏</p>
            </div>
        </div>
    </div>
</body>
</html>
